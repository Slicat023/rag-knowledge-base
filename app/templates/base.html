<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="{{ active }}" data-default-llm="{{ default_llm }}">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="{{ app_name }} 首页">
        <span class="brand-mark">知</span>
        <span class="brand-text">
          <strong>知库</strong>
          <small>RAG KNOWLEDGE</small>
        </span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="nav-item {% if active == 'chat' %}active{% endif %}" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>知识问答</span>
        </a>
        <a class="nav-item {% if active == 'knowledge' %}active{% endif %}" href="/knowledge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h6"/></svg>
          <span>知识库文件</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-card">
        <div class="sidebar-card-title"><span class="pulse-dot" id="model-dot"></span>本地模型</div>
        <p id="model-status">正在检查服务状态…</p>
      </div>
      <div class="sidebar-foot">
        <span>LlamaIndex · Chroma</span>
        <span>v{{ version }}</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开导航">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-heading">
          <span class="eyebrow">{% block eyebrow %}知识工作台{% endblock %}</span>
          <h1>{% block page_title %}知识问答{% endblock %}</h1>
        </div>
        <div class="topbar-actions">
          {% block topbar_actions %}{% endblock %}
        </div>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
